name: Update Bing image

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'script/crawler.py'
      - '.github/workflows/update.yml'
  schedule:
    # 每天北京时间 15:00 运行 (7:00 UTC)
    - cron: "0 7 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    # 设置权限，确保 Action 有权写入仓库
    permissions:
      contents: write

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 只拉取最新一次提交，节省空间

      # 2. 🔥 核心优化：清理磁盘空间
      # 这一步能释放出约 20GB-30GB 的空间
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 3. 设置 Python 环境
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # 升级到较新的 Python 版本
          cache: 'pip' # 自动缓存依赖，加快下次运行速度

# 4. 安装系统依赖和 Python 依赖
      - name: Install System and Python dependencies
        run: |
          # 1. 安装编译旧版 Pillow (8.3.2) 所需的底层图像库
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev
          
          # 2. 升级 pip 并安装核心库
          cd script
          python -m pip install --upgrade pip
          # 显式安装 undetected-chromedriver，防止 requirements.txt 里漏掉
          pip install undetected-chromedriver beautifulsoup4 requests
          
          # 3. 安装剩余的依赖
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 5. 运行爬虫 (带 wait)
      - name: Update image with wait
        if: github.event_name == 'schedule'
        run: |
          export TZ=Asia/Shanghai
          cd script
          python crawler.py --wait
        env:
          BOTTOKEN: ${{ secrets.BOTTOKEN }}
          CHANNELIDMAIN: ${{ secrets.CHANNELIDMAIN }}
          CHANNELIDARCHIVE: ${{ secrets.CHANNELIDARCHIVE }}

      # 6. 运行爬虫 (不带 wait)
      - name: Update image without wait
        if: github.event_name != 'schedule'
        run: |
          export TZ=Asia/Shanghai
          cd script
          python crawler.py
        env:
          BOTTOKEN: ${{ secrets.BOTTOKEN }}
          CHANNELIDMAIN: ${{ secrets.CHANNELIDMAIN }}
          CHANNELIDARCHIVE: ${{ secrets.CHANNELIDARCHIVE }}

      # 7. 整理文件
      - name: Move files to archive
        run: |
          mkdir -p archive
          # 使用 cp -r 或 mv，增加 -f 强制覆盖防止交互
          [ -d data ] && mv -f data archive/
          [ -d img ] && mv -f img archive/

      # 8. 🚀 部署到 archive 分支
      - name: Push archives
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: archive # 要部署的文件夹
          branch: archive # 目标分支
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: false # 关键：设为 false 以保留 archive 分支上的旧图片
          commit_message: "Update Bing images [skip ci]"
